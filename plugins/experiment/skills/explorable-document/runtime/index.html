<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' about:; base-uri 'none'; form-action 'none'; object-src 'none';"><title>Explorable document</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="viewer.css"></head><body><header><div class="header-tools"><select id="theme" aria-label="Theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></div><div class="header-copy"><h1 id="title">Explorable document</h1><p id="summary"></p><p id="identity"></p><button type="button" id="share" hidden>Review snapshot</button></div></header><p id="status" role="status">Loading document…</p><main><section id="fallback" hidden></section><iframe id="document" title="Interactive document" sandbox="allow-scripts" referrerpolicy="no-referrer" allow="camera 'none'; microphone 'none'; geolocation 'none'; clipboard-write 'none'"></iframe></main><dialog id="review" aria-labelledby="review-title"><h2 id="review-title">Review snapshot</h2><p>This frozen copy is what will be saved. No agent is notified.</p><pre id="snapshot"></pre><label for="comment">Optional comment</label><textarea id="comment" maxlength="4000"></textarea><p id="receipt" role="status"></p><div class="actions"><button type="button" id="submit">Save for agent</button><button type="button" id="download">Download snapshot</button><button type="button" id="refresh">Refresh snapshot</button><button type="button" id="cancel">Close</button></div></dialog><dialog id="navigation" aria-labelledby="navigation-title"><h2 id="navigation-title">Open external reference</h2><p>Leaving the document is a reader action.</p><a href="ht
