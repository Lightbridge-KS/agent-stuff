# pseudonym — reversible research pseudonyms: <PERSON_1>, <PERSON_2> … consistent within the run,
# dates shifted by one random offset, identifiers hashed. Requires --sidecar; restore reverses it.
language: en
columns: {hn: ID, mrn: ID, patient_id: ID}   # csv/json: bare identifier columns NER cannot type
threshold: 0.5
operators:
  DEFAULT:       {op: pseudonym}
  PERSON:        {op: pseudonym}
  DATE_TIME:     {op: date_shift, days: random, range: 365}
  LOCATION:      {op: pseudonym}
  ORGANIZATION:  {op: keep}
  PHONE_NUMBER:  {op: pseudonym}
  EMAIL_ADDRESS: {op: pseudonym}
  URL:           {op: keep}
