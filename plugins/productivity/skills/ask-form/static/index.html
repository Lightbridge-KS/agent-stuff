<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'">
<meta name="color-scheme" content="light dark">
<title>ask-form</title>
<script src="/static/prefs.js"></script>
<link rel="stylesheet" href="/static/styles.css">
<!--SPEC-->
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main id="app" class="page">
  <header class="masthead">
    <p class="kicker">Your agent is asking</p>
    <h1 id="title"></h1>
    <div id="intro" class="intro prose"></div>
  </header>
  <div id="questions"></div>
</main>
<footer id="footer" class="footer" hidden>
  <div class="footer-inner">
    <div class="footer-left">
      <button id="settings" type="button" class="settings-btn" popovertarget="settings-panel" aria-label="Settings: layout and theme" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
        </svg>
      </button>
      <p id="progress" class="progress" aria-live="polite"></p>
    </div>
    <div class="actions">
      <button id="cancel" type="button" class="btn quiet">Cancel</button>
      <button id="submit" type="button" class="btn primary">Send answers</button>
    </div>
  </div>
  <div id="fill" class="fill"></div>
</footer>
<div id="settings-panel" class="settings-panel" popover></div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/rich.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
